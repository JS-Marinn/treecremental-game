currencies:
  - { id: logs_<species>, scope: per_species, resets_on_breakthrough: true, source: logging_camp }
  - { id: planks_<species>, scope: per_species, resets_on_breakthrough: true, source: sawmill }
  - { id: charcoal, scope: global, resets_on_breakthrough: true, source: charcoal_kilns }
  - { id: ash, scope: global, resets_on_breakthrough: true, source: charcoal_kilns }
  - { id: birdseed, scope: global, resets_on_breakthrough: false, source: canopy_aviary }
  - { id: spores, scope: global, resets_on_breakthrough: false, source: mycelium_network }
  - { id: sap, scope: global, resets_on_breakthrough: false, source: heartwood_ascension }

gameplay_loops:
  - { id: logging_camp, role: primary, resets_on_breakthrough: true }
  - { id: sawmill, role: secondary_a, resets_on_breakthrough: true }
  - { id: charcoal_kilns, role: secondary_b, resets_on_breakthrough: true }
  - { id: canopy_aviary, role: tertiary_isolated_a, resets_on_breakthrough: false }
  - { id: mycelium_network, role: tertiary_isolated_b, resets_on_breakthrough: false }
  - { id: heartwood_ascension, role: prestige_layer, resets_on_breakthrough: false }

