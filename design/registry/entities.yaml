# Treecremental -- Game World & Systems Entity Registry (v0.6)
# Single source of truth for all named identifiers across design docs, data files, and code.

schema_version: 3
revised: 2026-10-31

acts:
  - id: act_1
    name_key: KEY_ACT_1_NAME
    biome: meadow
    trees: [pine, birch, oak]
    prop_cap: 4
    gear_cap: 3
    sawmill_cap: 4
    breakthrough_gate_coins: 247000
  - id: act_2
    name_key: KEY_ACT_2_NAME
    biome: blossom_boreal
    trees: [sakura, canadian_maple, fir]
    prop_cap: 7
    gear_cap: 5
    sawmill_cap: 7
    breakthrough_gate_coins: 7160000
  - id: act_3
    name_key: KEY_ACT_3_NAME
    biome: ancient_grove
    trees: [baobab, socotra_dragon_tree, giant_sequoia]
    prop_cap: 10
    gear_cap: 6
    sawmill_cap: 10
    breakthrough_gate_coins: 46200000

worker_types:
  - id: simple_lumberjack
    role: versatile_chopper_and_shared_miller
    footprint_px: "16x16"
    can_chop_all_trees: true
    allowed_loop_ids: [logging_camp, sawmill]
    act_caps: [14, 24, 34]
  - id: heavy_sawyer
    role: armor_piercing_durability_shredder
    footprint_px: "20x16"
    can_chop_all_trees: true
    allowed_loop_ids: [logging_camp]
    act_caps: [6, 12, 18]
  - id: swift_cleaver
    role: high_tempo_crit_and_synergy_specialist
    footprint_px: "16x16"
    can_chop_all_trees: true
    allowed_loop_ids: [logging_camp]
    act_caps: [5, 10, 15]

species:
  - { id: pine, tier: 0, act: 1, base_hp: 20, bark_hardness: 0, base_coin_value: 1.00, synergy_id: pitch_sap_splatter }
  - { id: birch, tier: 1, act: 1, base_hp: 35, bark_hardness: 1, base_coin_value: 2.20, synergy_id: silver_bark_kindling }
  - { id: oak, tier: 2, act: 1, base_hp: 65, bark_hardness: 2, base_coin_value: 5.00, synergy_id: acorn_mast_shower }
  - { id: sakura, tier: 3, act: 2, base_hp: 120, bark_hardness: 2, base_coin_value: 12.00, synergy_id: cherry_petal_rain }
  - { id: canadian_maple, tier: 4, act: 2, base_hp: 220, bark_hardness: 3, base_coin_value: 28.00, synergy_id: sugarbush_sap_flow }
