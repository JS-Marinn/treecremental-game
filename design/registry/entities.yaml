  - { id: socotra_dragon_tree, tier: 7, act: 3, base_hp: 1400, bark_hardness: 5, base_coin_value: 370.00, synergy_id: cinnabar_dragons_blood }
  - { id: giant_sequoia, tier: 8, act: 3, base_hp: 2800, bark_hardness: 6, base_coin_value: 900.00, synergy_id: seismic_timberfall }

currencies:
  - { id: coins, scope: global_main_loop, resets_on_breakthrough: true, source: logging_camp }
  - { id: processed_logs, scope: global_sawmill, resets_on_breakthrough: true, source: sawmill }
  - { id: charcoal, scope: global_kiln, resets_on_breakthrough: true, source: charcoal_kilns }
  - { id: ash, scope: global_kiln, resets_on_breakthrough: true, source: charcoal_kilns }
  - { id: birdseed, scope: global_tertiary_a, resets_on_breakthrough: false, source: canopy_aviary }
  - { id: spores, scope: global_tertiary_b, resets_on_breakthrough: false, source: mycelium_network }
  - { id: sap, scope: global_prestige, resets_on_breakthrough: false, source: heartwood_ascension }

gameplay_loops:
  - { id: logging_camp, role: primary, requires_input_material: false, resets_on_breakthrough: true }
  - { id: sawmill, role: secondary_value_amplifier, requires_input_material: false, resets_on_breakthrough: true }
  - { id: charcoal_kilns, role: secondary_thermal_overclock, requires_input_material: false, resets_on_breakthrough: true }
  - { id: canopy_aviary, role: tertiary_isolated_a, requires_input_material: false, resets_on_breakthrough: false }
  - { id: mycelium_network, role: tertiary_isolated_b, requires_input_material: false, resets_on_breakthrough: false }
  - { id: heartwood_ascension, role: prestige_layer, requires_input_material: false, resets_on_breakthrough: false }

