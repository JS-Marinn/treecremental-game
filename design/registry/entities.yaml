# Treecremental -- Game World & Systems Entity Registry
# Single source of truth for all named identifiers across design docs, data files, and code.

schema_version: 1
revised: 2026-10-30

acts:
  - id: act_1
    name_key: KEY_ACT_1_NAME
    biome: meadow
    trees: [pine, birch, oak]
    worker_cap: 30
    tool_cap: 3
    sawmill_cap: 4
    breakthrough_gate_species: oak
    breakthrough_gate_logs: 247000
  - id: act_2
    name_key: KEY_ACT_2_NAME
    biome: blossom_boreal
    trees: [sakura, canadian_maple, fir]
    worker_cap: 50
    tool_cap: 5
    sawmill_cap: 7
    breakthrough_gate_species: fir
    breakthrough_gate_logs: 7160000
  - id: act_3
    name_key: KEY_ACT_3_NAME
    biome: ancient_grove
    trees: [baobab, socotra_dragon_tree, giant_sequoia]
    worker_cap: 70
    tool_cap: 6
    sawmill_cap: 10
    breakthrough_gate_species: giant_sequoia
    breakthrough_gate_logs: 46200000

