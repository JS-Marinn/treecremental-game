schema_version: 2
revised: 2026-10-31

project:
  name: "Treecremental"
  version_spec: "v0.6"
  stage: "production"
  current_milestone: "M2_editable_right_docked_tscn_ui_groundwork"
  repository_url: "https://github.com/JS-Marinn/treecremental-game"
  genre: "2d-pixel-art-incremental"
  session_model: "active-session-only"
  offline_progression: false
  target_duration_hours:
    main_campaign: 3.0
    completionist_100: 4.0

gameplay_architecture:
  main_currency: "coins"
  sawmill_currency: "processed_logs"
  sawmill_requires_input_material: false
  tree_unlock_mode: "spawn_probability_and_max_quantity_upgrades"
  worker_types_count: 3
  worker_types:
    - id: "simple_lumberjack"
      shared_loops: ["logging_camp", "sawmill"]
    - id: "heavy_sawyer"
      shared_loops: ["logging_camp"]
    - id: "swift_cleaver"
      shared_loops: ["logging_camp"]
  modularity_pattern: "composable_tres_resources_and_central_stat_aggregator"

engine:
  name: "godot"
  version: "4.7.2.stable"
  renderer: "gl_compatibility"
  language: "GDScript"
  viewport:
    width: 640
    height: 360
    left_compound_width: 432
    right_dock_width: 208
    ui_layout: "right_hand_docked"
    stretch_mode: "canvas_items"
    scale_mode: "integer"
    texture_filter: "nearest"

paths:
  code_root: "src/"
  data_root: "data/"
  design_root: "design/"
  docs_root: "docs/"
  i18n_root: "i18n/"
  test_root: "tests/"
  tools_root: "tools/"
  session_state: "production/session-state/active.md"
  entity_registry: "design/registry/entities.yaml"
  master_design_doc: "docs/architecture/treecremental_design_doc.md"
  art_blueprint: "design/art/art_steam_blueprint.md"
  external_autopilot_repo: "C:/Users/MrSeb/Downloads/Autopilot-Godot"

standards:
  zero_hardcoded_values: true
  extreme_modularity_no_refactor: true
  zero_offline_mechanics: true
  zero_emojis: true
  zero_ai_artifacts: true
  autopilot_git_isolated: true
  base_locale: "en"
  supported_locales:
    - "en"
    - "es_419"
    - "es_ES"
